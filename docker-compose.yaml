
services:
  namenode:
    image: apache/hadoop:3.5.0
    container_name: namenode
    hostname: namenode
    user: root
    volumes:
      - ./namenode_data:/data/dfs/name
      - ./config/hdfs-configs/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./config/hdfs-configs/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./config/hdfs-configs/log4j.properties:/opt/hadoop/etc/hadoop/log4j.properties:ro
    ports:
      - "9870:9870"
      - "9000:9000"
    environment:
      - HADOOP_HOME=/opt/hadoop
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
      - HADOOP_LOG_DIR=/opt/hadoop/logs
      - HDFS_NAMENODE_USER=root
    command: >
      /bin/sh -c 'if [ ! -d "/data/dfs/name/current" ]; then
                      echo "Formatting /data/dfs/name ..."
                      hdfs namenode -format -force -nonInteractive
                  fi
                  echo "Launching NameNode service..."
                  exec hdfs namenode'
    restart: unless-stopped

  datanode1:
    image: apache/hadoop:3.5.0
    container_name: datanode1
    hostname: datanode1
    user: root
    volumes:
      - ./datanode1_data:/data/dfs/data
      - ./config/hdfs-configs/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./config/hdfs-configs/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./config/hdfs-configs/log4j.properties:/opt/hadoop/etc/hadoop/log4j.properties:ro
    environment:
      - HADOOP_HOME=/opt/hadoop
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
      - HADOOP_LOG_DIR=/opt/hadoop/logs
      - HDFS_DATANODE_USER=root
    command: /bin/sh -c "exec hdfs datanode"
    restart: unless-stopped

