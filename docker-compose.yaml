      - ./config/yarn-configs/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml:ro
      - ./config/yarn-configs/mapred-site.xml:/opt/hadoop/etc/hadoop/mapred-site.xml:ro
      - ./:/workspace
    environment:
      - HADOOP_HOME=/opt/hadoop
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
      - HADOOP_LOG_DIR=/opt/hadoop/logs
    working_dir: /workspace
    tty: true
    stdin_open: true
    command: /bin/sh -c "sleep infinity"
    restart: unless-stopped
